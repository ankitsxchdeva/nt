<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript><div id="nojs">clock, weather, and search need javascript.</div></noscript>
    <div id="search">
        <input id="search-field" type="text" name="search-field" aria-label="search" placeholder="search" autocomplete="off" spellcheck="false"/>
    </div>
    <!-- Drifting, softly glowing lavender particles over flat night plum -->
    <canvas id="snow" aria-hidden="true"></canvas>
    <!-- Top-left: weather -->
    <div class="panel panel-left">
        <div class="box" id="weather">
            <div class="row">
                <div id="weather-description" class="inline"></div>
                <div class="inline" id="weather-sep">-</div>
                <div id="temp" class="inline"></div>
            </div>
        </div>
    </div>
    <!-- Top-right stack: tracked tickers -->
    <div class="panel panel-right">
        <div class="box stock" id="qqq">
            <a class="ticker" href="https://google.com/search?q=QQQ+stock" target="_blank" rel="noopener">QQQ</a>
            <div class="price">—</div>
            <div class="change"></div>
        </div>
        <div class="box stock" id="smh">
            <a class="ticker" href="https://google.com/search?q=SMH+stock" target="_blank" rel="noopener">SMH</a>
            <div class="price">—</div>
            <div class="change"></div>
        </div>
    </div>
    <div class="container">
        <div id="clock"></div>
        <div id="date"></div>
    </div>
    <!-- Bottom-right stack: home + news links, sunrise over sunset, super subtle -->
    <div id="corner">
        <a id="home" href="https://ankit.casa" target="_blank" rel="noopener">home</a>
        <a id="news" href="https://ankitsachdeva.com/lede/" target="_blank" rel="noopener">news</a>
        <div id="sun"></div>
    </div>

    <script>
        // Search on enter
        document.getElementById("search-field").addEventListener("keydown",  event => {
            if (event.key === "Enter") {
                var val = document.getElementById("search-field").value.trim();
                if (val) window.open("https://google.com/search?q=" + encodeURIComponent(val));
            }
        });
        // Get current time and format
        getTime = () => {
            let date = new Date(),
                min = date.getMinutes(),
                hour = date.getHours();

            return "" +
                ((hour + 24) % 12 || 12) + ":" +
                (min < 10 ? ("0" + min) : min)
        }

        // Long-form date line under the clock
        const updateDate = () => {
            document.getElementById("date").innerHTML = new Date().toLocaleDateString(undefined, {
                weekday: "long", month: "long", day: "numeric"
            });
        }

        // Fetch an ETF/stock quote through the same Worker proxy (keeps us off
        // the data provider directly — no key in the page, no CORS headache).
        const loadStock = (symbol, boxId) => {
            let box = document.getElementById(boxId),
                priceEl = box.querySelector(".price"),
                changeEl = box.querySelector(".change");
            let xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://nt-weather.ankitsachdeva001.workers.dev/?symbol=' + symbol);
            xhr.onload = () => {
                if (xhr.readyState !== 4) return;
                if (xhr.status === 200) {
                    let json = JSON.parse(xhr.responseText),
                        price = json.price,
                        prev = json.previousClose;
                    if (price == null || prev == null) { priceEl.innerHTML = "N/A"; return; }
                    let change = price - prev,
                        pct = (change / prev) * 100,
                        sign = change >= 0 ? "+" : "";
                    priceEl.innerHTML = "$" + price.toFixed(2);
                    changeEl.innerHTML = sign + change.toFixed(2) + " (" + sign + pct.toFixed(2) + "%)";
                    changeEl.className = "change " + (change >= 0 ? "up" : "down");
                } else {
                    console.error('Stock API Error:', symbol, xhr.status);
                    priceEl.innerHTML = "N/A";
                }
            }
            xhr.onerror = () => {
                console.error('Stock API Request Failed:', symbol);
                priceEl.innerHTML = "N/A";
            }
            xhr.send();
        }

        // ---- Abstract particle field: drifting, glowing, twinkling points ----
        (function particles() {
            const canvas = document.getElementById("snow"),
                  ctx = canvas.getContext("2d");
            // Canonical dark-row lights — pale lavender, stone lilac, wisteria,
            // sky indigo, plus rare pale-coral sparks (editorial ink). All the
            // light/color comes from the particles themselves; weight favors
            // quiet lavender dust over the rarer colored sparks.
            const palette = [
                "232, 228, 244",  // pale lavender
                "232, 228, 244",  // pale lavender
                "232, 228, 244",  // pale lavender
                "142, 138, 171",  // stone lilac
                "142, 138, 171",  // stone lilac
                "139, 135, 200",  // wisteria
                "157, 184, 220",  // sky indigo
                "222, 145, 128"   // pale coral, editorial ink: the rare warm spark
            ];
            let pts = [], w, h;
            const resize = () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                const count = Math.round((w * h) / 17000);
                pts = Array.from({ length: count }, (_, i) => {
                    const orb = i % 7 === 0;                  // ~1 in 7 is a bigger glowing orb
                    return {
                        x: Math.random() * w,
                        y: Math.random() * h,
                        r: orb ? Math.random() * 2.2 + 2.4 : Math.random() * 1.6 + 0.8,
                        a: Math.random() * Math.PI * 2,       // drift heading
                        v: Math.random() * 0.18 + 0.05,       // drift speed
                        c: palette[Math.floor(Math.random() * palette.length)],
                        base: orb ? Math.random() * 0.3 + 0.55 : Math.random() * 0.4 + 0.4,
                        tw: Math.random() * 0.025 + 0.008,    // twinkle speed
                        ph: Math.random() * Math.PI * 2,      // twinkle phase
                        glow: orb ? 8 : 6                     // glow radius multiplier
                    };
                });
            };
            const draw = () => {
                ctx.clearRect(0, 0, w, h);
                for (const p of pts) {
                    p.ph += p.tw;
                    const o = p.base + Math.sin(p.ph) * 0.25;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(" + p.c + ", " + Math.min(Math.max(o, 0.08), 1) + ")";
                    ctx.shadowColor = "rgba(" + p.c + ", 1)";
                    ctx.shadowBlur = p.r * p.glow;            // the glow lives on the particle
                    ctx.fill();
                    p.x += Math.cos(p.a) * p.v;
                    p.y += Math.sin(p.a) * p.v;
                    if (p.x < -10) p.x = w + 10;
                    if (p.x > w + 10) p.x = -10;
                    if (p.y < -10) p.y = h + 10;
                    if (p.y > h + 10) p.y = -10;
                }
                ctx.shadowBlur = 0;
                requestAnimationFrame(draw);
            };
            const drawStatic = () => {
                ctx.clearRect(0, 0, w, h);
                for (const p of pts) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(" + p.c + ", " + p.base + ")";
                    ctx.shadowColor = "rgba(" + p.c + ", 1)";
                    ctx.shadowBlur = p.r * p.glow;
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            };
            window.addEventListener("resize", resize);
            resize();
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) drawStatic();
            else draw();
        })();

        // Paint the clock + date right away so the entrance animation lands on
        // real content — window.onload can lag behind while web fonts load.
        const tick = () => {
            document.getElementById("clock").innerHTML = getTime();
            updateDate();
        };
        tick();
        setInterval(tick, 1000);

        // Weather failure renders as one muted lowercase line naming the retry.
        const weatherFail = () => {
            document.getElementById("weather-description").innerHTML = "weather unavailable, reload to retry";
            document.getElementById("weather-sep").style.display = "none";
            document.getElementById("temp").innerHTML = "";
        }

        window.onload = () => {
            let xhr = new XMLHttpRequest();
            // Weather is fetched through a Cloudflare Worker proxy that keeps the
            // OpenWeatherMap API key as a secret, so the key never ships to the browser.
            xhr.open('GET', 'https://nt-weather.ankitsachdeva001.workers.dev');
            xhr.onload = () => {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        let json = JSON.parse(xhr.responseText);
                        document.getElementById("temp").innerHTML = json.main.temp.toFixed(0) + "°";
                        document.getElementById("weather-description").innerHTML = json.weather[0].description;
                        // Sunrise / sunset come free with the same response (Unix UTC seconds)
                        if (json.sys && json.sys.sunrise && json.sys.sunset) {
                            const fmtSun = ts => {
                                let d = new Date(ts * 1000),
                                    h = d.getHours(), m = d.getMinutes();
                                return ((h + 24) % 12 || 12) + ":" + (m < 10 ? "0" + m : m);
                            };
                            document.getElementById("sun").innerHTML =
                                "☀ " + fmtSun(json.sys.sunrise) + "<br>☾ " + fmtSun(json.sys.sunset);
                        }
                    } else {
                        console.error('Weather API Error:', xhr.status);
                        weatherFail();
                    }
                }
            }
            xhr.onerror = () => {
                console.error('Weather API Request Failed');
                weatherFail();
            }
            xhr.send();
            // Tracked tickers, refreshed alongside the page load
            loadStock("QQQ", "qqq");
            loadStock("SMH", "smh");
        }

        document.addEventListener("keydown", event => {
            let field = document.getElementById('search-field');
            if (event.key === " " && !event.metaKey && !event.ctrlKey && !event.altKey) {
                if (event.target === field) return;   // already typing in the overlay
                event.preventDefault();               // keep the page from scrolling
                document.getElementById('search').style.display = 'flex';
                field.focus();
            } else if (event.key === "Escape") {      // Esc to close search
                field.value = '';
                field.blur();
                document.getElementById('search').style.display = 'none';
            }
        });
    </script>
</body>
</html>
